<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lesson 3 Practice</title>
  <style>
    :root {
      color-scheme: light;
      --navy: #07162f;
      --blue: #0f4fb8;
      --gold: #d6a84f;
      --paper: #fffaf0;
      --ink: #162033;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 18%, rgba(214, 168, 79, 0.28), transparent 28rem),
        radial-gradient(circle at 86% 12%, rgba(15, 79, 184, 0.22), transparent 24rem),
        linear-gradient(135deg, #06142d 0%, #123a82 48%, #f8edd4 49%, #fffaf0 100%);
    }

    main {
      width: min(100%, 430px);
      margin: 0 auto;
      padding: 42px 14px;
    }

    .hero {
      min-height: 34vh;
      display: grid;
      align-content: end;
      gap: 18px;
      color: white;
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.34);
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 58px;
      line-height: 0.86;
      letter-spacing: 0;
    }

    .lead {
      margin: 0;
      max-width: 640px;
      font-size: 17px;
      line-height: 1.65;
      font-weight: 700;
    }

    .links {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
      margin-top: 42px;
    }

    a {
      min-height: 190px;
      display: grid;
      align-content: end;
      gap: 12px;
      padding: 26px;
      color: var(--ink);
      text-decoration: none;
      background: rgba(255, 250, 240, 0.92);
      border: 1px solid rgba(214, 168, 79, 0.62);
      border-radius: 8px;
      box-shadow: 0 22px 54px rgba(4, 13, 31, 0.24);
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    a:hover {
      transform: translateY(-4px);
      box-shadow: 0 28px 64px rgba(4, 13, 31, 0.32);
    }

    .label {
      color: var(--blue);
      font-size: 15px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .title {
      font-size: 31px;
      font-weight: 900;
    }

    .desc {
      color: #4b5870;
      font-size: 16px;
      line-height: 1.55;
      font-weight: 700;
    }

    @media (max-width: 720px) {
      a {
        min-height: 160px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <h1>Lesson 3<br>Practice</h1>
      <p class="lead">SOUND DESIGN LAB SPS 2026 の第3回レッスン用プラクティスページです。</p>
    </section>

    <section class="links" aria-label="Practice links">
      <a href="./sdl-sps2026/lesson3/practice1/">
        <span class="label">Practice 1</span>
        <span class="title">Stress Practice</span>
        <span class="desc">強勢を意識して音読する課題ページ。</span>
      </a>
      <a href="./sdl-sps2026/lesson3/practice2/">
        <span class="label">Practice 2</span>
        <span class="title">Flap T Practice</span>
        <span class="desc">音声を聞きながらFlap Tを確認する課題ページ。</span>
      </a>
    </section>
  </main>
</body>
</html>
